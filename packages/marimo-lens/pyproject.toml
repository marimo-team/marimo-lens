[build-system]
requires = ["agent-plugins>=0.2.4", "hatchling>=1.26.3"]
build-backend = "agent_plugins.build.hatchling"

[project]
name = "marimo-lens"
version = "0.2.4"
description = "Point at results in a marimo notebook, hand them to your agent with a note, and optionally keep a record of what each request changed"
requires-python = ">=3.10,<3.15"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "agent-plugins>=0.2.4",
  "anywidget>=0.9",
  "marimo>=0.25.2",
  "pydantic>=2.4",
  "traitlets>=5",
  "typing-extensions>=4.4",
]

[project.scripts]
marimo-lens = "marimo_lens.__main__:main"

[project.entry-points."marimo.agent.capability"]
lens = "marimo_lens._capability"

[project.urls]
Documentation = "https://marimo-team.github.io/marimo-lens/"
"Documentation Index" = "https://marimo-team.github.io/marimo-lens/llms.txt"
Issues = "https://github.com/marimo-team/marimo-lens/issues"
Source = "https://github.com/marimo-team/marimo-lens"

[dependency-groups]
dev = ["hatchling>=1.26.3"]

[tool.hatch.build]
only-packages = true
artifacts = ["src/marimo_lens/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/marimo_lens"]

[tool.hatch.build.targets.sdist]
include = ["/hatch_build.py", "/README.md", "/pyproject.toml", "/src/marimo_lens"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.agent-plugins]
root = "../.."
