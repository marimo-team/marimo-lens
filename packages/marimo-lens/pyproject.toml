[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marimo-lens"
version = "0.0.4"
description = "Ground your agent's work in the code and context behind the result you select in a marimo notebook"
requires-python = ">=3.11,<3.15"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["anywidget>=0.11.0", "marimo>=0.23.0", "pydantic>=2", "traitlets>=5"]

[project.urls]
Documentation = "https://marimo-team.github.io/marimo-lens/"
Issues = "https://github.com/marimo-team/marimo-lens/issues"
Source = "https://github.com/marimo-team/marimo-lens"

[dependency-groups]
dev = ["hatchling>=1.29"]

[tool.hatch.build]
only-packages = true
artifacts = ["src/marimo_lens/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/marimo_lens"]

[tool.hatch.build.targets.sdist]
include = ["/hatch_build.py", "/README.md", "/pyproject.toml", "/src/marimo_lens"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
