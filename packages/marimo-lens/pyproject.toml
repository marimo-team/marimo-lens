[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marimo-lens"
version = "0.0.0"
description = "Cell-backed visual selections for live marimo notebooks"
requires-python = ">=3.11,<3.15"
readme = "README.md"
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["anywidget-bundle==0.0.1", "anywidget>=0.11.0", "marimo>=0.23.0", "traitlets>=5"]

[dependency-groups]
dev = ["hatchling>=1.29"]

[tool.hatch.build]
only-packages = true
artifacts = ["src/marimo_lens/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/marimo_lens"]

[tool.hatch.build.targets.sdist]
include = ["/hatch_build.py", "/README.md", "/pyproject.toml", "/src/marimo_lens"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
