packages:
  - apps/*
  - packages/*

patchedDependencies:
  html-to-image@1.11.13: patches/html-to-image@1.11.13.patch

catalogMode: prefer

catalog:
  "@anywidget/react": ^0.2.2
  "@anywidget/types": ^0.4.0
  "@marimo-team/mdx-marimo": 0.0.5
  "@playwright/test": 1.64.0
  "@stylexjs/stylex": 0.19.1
  "@stylexjs/unplugin": 0.19.1
  "@types/node": ^26.6.5
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  esbuild: ^0.28.2
  html-to-image: 1.11.13
  jsdom: 30.1.2
  knip: 6.41.0
  lucide-react: ^1.55.0
  portless: 0.15.7
  react: ^19.3.0
  react-dom: ^19.3.0
  typescript: ^7.0.2
  valibot: ^1.5.0
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
  vitepress: ^1.6.4
  vitepress-plugin-llms: 1.14.0
  vue: ^3.5.43

overrides:
  vite@*: "catalog:"
  vitepress>vite: 6.4.3
  nanoid@<3.3.18: 3.3.18

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  "@manzt/uv": true
  esbuild: true

minimumReleaseAge: 20160
verifyDepsBeforeRun: install
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - undici-types@6.21.0
  - vite@5.4.21
  - semver@6.3.1
minimumReleaseAgeExclude:
  - "@marimo-team/*"
  - "@stylexjs/babel-plugin"
  - "@stylexjs/shared"
  - "@stylexjs/stylex"
  - "@stylexjs/unplugin"
onlyBuiltDependencies: []
