packages:
  - apps/*
  - packages/*

patchedDependencies:
  html-to-image@1.11.13: patches/html-to-image@1.11.13.patch

catalogMode: prefer

catalog:
  "@anywidget/react": ^0.2.2
  "@anywidget/types": ^0.4.0
  "@marimo-team/mdx-marimo": 0.0.2
  "@types/node": ^22.20.1
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  esbuild: ^0.28.0
  html-to-image: 1.11.13
  jsdom: 29.1.1
  lucide-react: 1.24.0
  react: ^19.2.7
  react-dom: ^19.2.7
  typescript: ^6.0.3
  valibot: 1.4.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.4
  vite-plus: 0.2.4
  vitepress: ^1.6.3
  vue: ^3.5.13

overrides:
  vite: "catalog:"
  vitepress>vite: ^5.4.0

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  "@manzt/uv": true
  esbuild: true

minimumReleaseAge: 20160
verifyDepsBeforeRun: install
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - undici-types@6.21.0
  - vite@5.4.21
minimumReleaseAgeExclude:
  - "@marimo-team/*"
onlyBuiltDependencies: []
