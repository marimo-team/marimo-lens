[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marimo-lens"
version = "0.0.0"
description = "Agent-ready feedback collection for live marimo notebooks"
dependencies = ["anywidget", "marimo>=0.23.0", "traitlets"]
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"

[dependency-groups]
dev = [
  "watchfiles",
  "marimo[recommended]",
  "pandas",
  "altair",
  "vega-datasets",
  "ruff>=0.15.13",
  "ty>=0.0.37",
  "pytest>=9.0.3",
  "hatchling>=1.29.0",
  "polars>=1.40.1",
  "duckdb>=1.5.2",
  "plotly>=6.7.0",
  "matplotlib>=3.10.9",
]

[tool.marimo.runtime]
output_max_bytes = 10_000_000_000


[tool.hatch.build]
only-packages = true
artifacts = ["src/marimo_lens/static/*"]

[tool.hatch.build.targets.sdist]
include = ["src/marimo_lens", "README.md", "LICENSE", "pyproject.toml", "scripts/hatch_build.py"]

[tool.hatch.build.targets.sdist.force-include]
"scripts/hatch_build.py" = "scripts/hatch_build.py"

[tool.hatch.build.hooks.custom]
path = "scripts/hatch_build.py"
