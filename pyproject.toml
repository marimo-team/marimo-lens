[tool.uv.workspace]
members = ["packages/marimo-lens"]

[dependency-groups]
dev = ["basedpyright>=1.40", "marimo>=0.24", "pyrefly>=1", "pytest>=9", "ruff>=0.16", "ty>=0.0.39"]

[tool.uv]
exclude-newer = "3 days"
exclude-newer-package = { agent-plugins = false, marimo = false }

[tool.basedpyright]
include = ["packages/marimo-lens", "examples", "scripts"]
extraPaths = ["packages/marimo-lens/src", "packages/marimo-lens"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
failOnWarnings = true

[tool.pyrefly]
project-includes = ["packages/marimo-lens", "examples", "scripts"]
search-path = ["packages/marimo-lens/src", "packages/marimo-lens"]

[tool.pyrefly.errors]
# Boundary normalizers intentionally coerce values after runtime narrowing.
unnecessary-type-conversion = "ignore"
