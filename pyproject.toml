[tool.uv.workspace]
members = ["packages/marimo-lens"]

[dependency-groups]
dev = ["pyrefly>=1", "pytest>=9.0.3", "ruff>=0.15.14", "ty>=0.0.39"]
workbench = [
  "altair",
  "anywidget",
  "marimo[recommended]>=0.23.0",
  "matplotlib",
  "plotly",
  "polars",
  "traitlets",
]

[tool.uv]
exclude-newer = "3 days"

[tool.pyrefly]
project-includes = ["packages/marimo-lens", "workbench"]
search-path = ["packages/marimo-lens/src", "packages/marimo-lens"]

[tool.pyrefly.errors]
# Boundary normalizers intentionally coerce values after runtime narrowing.
unnecessary-type-conversion = "ignore"

[tool.marimo.runtime]
output_max_bytes = 10_000_000_000
