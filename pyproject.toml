[tool.uv.workspace]
members = ["packages/marimo-lens"]

[dependency-groups]
# mdx-marimo compiles docs through marimo's private export API.
dev = ["marimo[recommended]==0.23.15", "pyrefly>=1", "pytest>=9.0.3", "ruff>=0.15.14", "ty>=0.0.39"]

[tool.uv]
exclude-newer = "3 days"
exclude-newer-package = { marimo = false }

[tool.pyrefly]
project-includes = ["packages/marimo-lens", "examples", "scripts"]
search-path = ["packages/marimo-lens/src", "packages/marimo-lens"]

[tool.pyrefly.errors]
# Boundary normalizers intentionally coerce values after runtime narrowing.
unnecessary-type-conversion = "ignore"
