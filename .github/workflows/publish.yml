name: Publish package

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: .node-version
          run-install: |
            - args: ["--frozen-lockfile"]

      - name: Check release version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use final-version form vX.Y.Z: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          package_version="$(uv version --package marimo-lens --short)"
          if [[ "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME must match package version v$package_version" >&2
            exit 1
          fi

      - name: Run release checks
        run: make check

      - name: Build package artifacts
        run: |
          rm -rf dist
          pnpm --filter @marimo-lens/python build
          uv build --no-sources --package marimo-lens --out-dir dist

      - name: Check package artifacts
        run: |
          uvx twine check dist/marimo_lens-*.whl dist/marimo_lens-*.tar.gz
          uv build --no-sources --wheel dist/marimo_lens-*.tar.gz --out-dir dist/from-sdist
          uv run --no-project --with dist/from-sdist/marimo_lens-*.whl python -c "from marimo_lens import Lens, LensContext, SelectionImage; Lens()"

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/marimo_lens-*.whl
            dist/marimo_lens-*.tar.gz
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write # Required for PyPI Trusted Publishing.
    steps:
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false

      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish package
        run: uv publish --trusted-publishing always dist/marimo_lens-*.whl dist/marimo_lens-*.tar.gz
