name: Publish package
run-name: >-
  ${{ github.event_name == 'workflow_run' &&
  format('Preview {0}', github.event.workflow_run.head_sha) || github.ref_name }}

# A vX.Y.Z tag publishes that release to PyPI. A main commit publishes a preview
# to the rolling `preview` GitHub prerelease once CI and GitHub Pages pass for
# it. Both channels build and attest the package the same way.
on:
  push:
    tags:
      - v[0-9]*.[0-9]*.[0-9]*
  workflow_run:
    workflows: [CI, GitHub Pages]
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: read
# Releases publish one at a time. Each main commit queues its workflow
# completions, so a pending check never replaces the one that publishes.
concurrency:
  group: >-
    ${{ github.event_name == 'push' && 'publish' ||
    format('publish-preview-{0}', github.event.workflow_run.head_sha) }}
  cancel-in-progress: false
  queue: max
jobs:
  resolve:
    name: Resolve publication
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.identity.outputs.channel }}
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
      publish: ${{ steps.identity.outputs.publish }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve channel and preview readiness
        id: identity
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_EVENT: ${{ github.event_name }}
          PREVIEW_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$PUBLICATION_EVENT" != workflow_run ]]; then
            printf 'channel=release\ncommit=%s\nversion=%s\npublish=true\n' \
              "$GITHUB_SHA" "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(./scripts/preview-version.sh "$PREVIEW_COMMIT")"
          printf 'channel=preview\ncommit=%s\nversion=%s\n' "$PREVIEW_COMMIT" "$version" >> "$GITHUB_OUTPUT"
          readiness=0
          ./scripts/require-preview-checks.sh "$PREVIEW_COMMIT" || readiness=$?
          if [[ "$readiness" == 3 ]]; then
            echo "::notice::The $version preview waits for CI and GitHub Pages for $PREVIEW_COMMIT."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          elif [[ "$readiness" != 0 ]]; then
            exit "$readiness"
          elif assets="$(gh release view preview --json assets --jq '.assets[] | select(.state == "uploaded" and .size > 0) | .name' 2>/dev/null)" &&
            grep -qxF "marimo-lens-$version-SHA256SUMS" <<<"$assets"; then
            echo "::notice::marimo-lens $version is already published as a preview."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python
        run: uv python install "$(cat .python-version)"
      - name: Set up JavaScript
        uses: ./.github/actions/setup-js
      - name: Check release version
        if: needs.resolve.outputs.channel == 'release'
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use final-version form vX.Y.Z: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          package_version="$(uv version --package marimo-lens --short)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "Package version $package_version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [ "$(git cat-file -t "$GITHUB_REF")" != tag ]; then
            echo "Release tag $GITHUB_REF_NAME must be annotated" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Set the preview version
        if: needs.resolve.outputs.channel == 'preview'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: uv version --package marimo-lens --no-sync "$VERSION"
      - name: Set up browser
        if: needs.resolve.outputs.channel == 'release'
        uses: ./.github/actions/setup-browser
      - name: Run release checks
        if: needs.resolve.outputs.channel == 'release'
        run: make check
      - name: Build and check package artifacts
        run: make package
      - name: Record preview checksums
        if: needs.resolve.outputs.channel == 'preview'
        working-directory: dist
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: >-
          sha256sum "marimo_lens-$VERSION-py3-none-any.whl" "marimo_lens-$VERSION.tar.gz"
          > "marimo-lens-$VERSION-SHA256SUMS"
      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/marimo_lens-*.whl
            dist/marimo_lens-*.tar.gz
            dist/marimo-lens-*-SHA256SUMS
          retention-days: 1
          if-no-files-found: error

  attest:
    name: Attest provenance
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      predicate_type: ${{ steps.provenance.outputs.predicate_type }}
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out preview publication tooling
        if: needs.resolve.outputs.channel == 'preview'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      # A workflow_run signs from the newest main workflow, which can be ahead
      # of the validated commit. Tagged releases keep native SLSA provenance.
      - name: Record preview source provenance
        id: provenance
        if: needs.resolve.outputs.channel == 'preview'
        env:
          PREVIEW_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: node scripts/preview-provenance.mjs "$PREVIEW_COMMIT" "$RUNNER_TEMP/preview-provenance.json"
      - name: Attest package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          predicate-type: ${{ steps.provenance.outputs.predicate_type }}
          predicate-path: >-
            ${{ needs.resolve.outputs.channel == 'preview' &&
            format('{0}/preview-provenance.json', runner.temp) || '' }}
          subject-path: |
            dist/marimo_lens-*.whl
            dist/marimo_lens-*.tar.gz
            dist/marimo-lens-*-SHA256SUMS

  publish:
    name: Publish
    needs: [resolve, attest]
    if: needs.resolve.outputs.channel == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/marimo-lens/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Publish package
        run: uv publish --trusted-publishing always dist/marimo_lens-*.whl dist/marimo_lens-*.tar.gz

  verify-pypi:
    name: Verify PyPI
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Wait for the public PyPI index
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          wheel="marimo_lens-${version}-py3-none-any.whl"
          sdist="marimo_lens-${version}.tar.gz"
          for attempt in $(seq 1 18); do
            if page="$(curl --fail --silent --show-error https://pypi.org/simple/marimo-lens/)" && \
               grep -Fq "$wheel" <<< "$page" && grep -Fq "$sdist" <<< "$page"; then
              exit 0
            fi
            printf 'PyPI index attempt %s of 18 did not find both artifacts for %s\n' \
              "$attempt" "$version"
            if [ "$attempt" -lt 18 ]; then
              sleep 10
            fi
          done
          echo "PyPI did not publish both artifacts for $version within three minutes" >&2
          exit 1
      - name: Verify the installed package
        env:
          UV_NO_CONFIG: "1"
        run: uv run --no-cache --no-project --isolated --default-index https://pypi.org/simple --with "marimo-lens==${GITHUB_REF_NAME#v}" python scripts/verify_release.py "${GITHUB_REF_NAME#v}"

  release-notes:
    name: Release notes
    needs:
      - publish
      - verify-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Update release notes
        run: npx --yes changelogithub@14.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  preview:
    name: Publish preview
    needs: [resolve, attest]
    if: needs.resolve.outputs.channel == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Every preview edits the same release, so uploads, notes, announcements,
    # and pruning run one commit at a time.
    concurrency:
      group: publish-preview-release
      cancel-in-progress: false
      queue: max
    environment:
      name: preview
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/preview
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Publish preview packages
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PREVIEW_COMMIT: ${{ needs.resolve.outputs.commit }}
          PREVIEW_PREDICATE_TYPE: ${{ needs.attest.outputs.predicate_type }}
        run: ./scripts/publish-preview.sh dist "$PREVIEW_COMMIT"
