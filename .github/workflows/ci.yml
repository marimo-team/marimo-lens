name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      distribution: ${{ steps.filter.outputs.distribution }}
      frontend_contracts: ${{ steps.filter.outputs.frontend_contracts }}
      python_contracts: ${{ steps.filter.outputs.python_contracts }}
      quality: ${{ steps.filter.outputs.quality }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/filters.yml
          predicate-quantifier: some-with-excludes

  quality:
    name: Quality
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install "$(cat .python-version)"

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]

      - name: Enable pnpm
        run: corepack enable

      - name: Check JavaScript formatting, linting, and types
        run: pnpm check

      - name: Check Python formatting, linting, and types
        run: |
          uv lock --check
          uv run ruff format --check
          uv run ruff check
          uv run ty check
          uv run pyrefly check --min-severity warn

      - name: Check shell scripts
        run: shellcheck scripts/*.sh

      - name: Check whitespace
        run: git diff --check

  test-python:
    name: Python ${{ matrix.python-version }}
    needs: changes
    if: needs.changes.outputs.python_contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]

      - name: Enable pnpm
        run: corepack enable

      - name: Build browser assets
        run: pnpm --filter @marimo-lens/python build

      - name: Run Python tests
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv run pytest -q

  test-js:
    name: JavaScript
    needs: changes
    if: needs.changes.outputs.frontend_contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]

      - name: Enable pnpm
        run: corepack enable

      - name: Run JavaScript tests
        run: pnpm test

      - name: Build JavaScript packages and docs
        run: pnpm build

  package:
    name: Package
    needs: changes
    if: needs.changes.outputs.distribution == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install "$(cat .python-version)"

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]

      - name: Enable pnpm
        run: corepack enable

      - name: Build and check package artifacts
        run: make package

      - name: Check generated files
        run: git diff --exit-code

  required:
    if: always()
    needs: [changes, quality, test-python, test-js, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          PACKAGE: ${{ needs.package.result }}
          QUALITY: ${{ needs.quality.result }}
          TEST_JS: ${{ needs.test-js.result }}
          TEST_PYTHON: ${{ needs.test-python.result }}
        run: |
          if [ "$CHANGES" != success ]; then
            printf 'Change classification failed: %s\n' "$CHANGES" >&2
            exit 1
          fi
          for result in "$QUALITY" "$TEST_PYTHON" "$TEST_JS" "$PACKAGE"; do
            if [ "$result" != success ] && [ "$result" != skipped ]; then
              printf 'Required jobs: quality=%s test-python=%s test-js=%s package=%s\n' \
                "$QUALITY" "$TEST_PYTHON" "$TEST_JS" "$PACKAGE" >&2
              exit 1
            fi
          done
