name: GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]

      - name: Enable pnpm
        run: corepack enable

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build docs
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: make docs

      - name: Verify docs base path
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          index=apps/docs/.vitepress/dist/index.html
          test -f apps/docs/.vitepress/dist/getting-started.html
          test -f apps/docs/.vitepress/dist/pair.html
          grep -q "href=\"${BASE_PATH}/assets/" "$index"
          grep -q "src=\"${BASE_PATH}/assets/" "$index"
          grep -q "href=\"${BASE_PATH}/getting-started\"" "$index"

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages
